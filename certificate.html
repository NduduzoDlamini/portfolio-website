<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificate | Nduduzo Dlamini</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >
  <style>
    :root {
      --bg: #0b1220;
      --surface: #121a2b;
      --border: #263349;
      --text: #E7ECF3;
      --muted: #8592AC;
      --accent: #5EEAD4;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    .cert-bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .cert-bar a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 600;
    }
    .cert-bar a:hover {
      color: var(--accent);
    }
    .cert-bar__title {
      margin-left: auto;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      text-align: right;
      max-width: 55%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cert-frame {
      flex: 1 1 auto;
      width: 100%;
      border: none;
      background: #fff;
    }
    .cert-fallback {
      flex: 0 0 auto;
      text-align: center;
      padding: 10px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }
    .cert-fallback a {
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
  </style>
</head>

<body>

  <div class="cert-bar">
    <a href="index.html#credentials">
      <i class="fa-solid fa-arrow-left"></i>
      Back to site
    </a>
    <span class="cert-bar__title" id="certTitle"></span>
  </div>

  <iframe class="cert-frame" id="certFrame" title="Certificate PDF"></iframe>

  <div class="cert-fallback">
    <a id="certFallback" href="#" target="_blank" rel="noopener">
      Trouble viewing? Open PDF directly
    </a>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var file = params.get("file");
      var title = params.get("title");

      if (file) {
        document.getElementById("certFrame").src = file + "#view=FitH";
        document.getElementById("certFallback").href = file;
      }

      if (title) {
        document.getElementById("certTitle").textContent = title;
        document.title = title + " | Nduduzo Dlamini";
      }
    })();
  </script>

</body>
</html>
